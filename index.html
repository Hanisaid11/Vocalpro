<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>VocalMaster Pro - Professional Vocal Training & Piano Studio</title>
    <meta name="description" content="Professional vocal range trainer, pitch detector, and realistic concert grand piano studio with human vocal timbres library." />
    
    <!-- PWA & Android APK Fullscreen Standards -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#030712" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VocalMaster" />
    <meta name="application-name" content="VocalMaster Pro" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Fullscreen WebView & Android Engine Directives -->
    <meta name="full-screen" content="yes" />
    <meta name="browsermode" content="application" />
    <meta name="screen-orientation" content="portrait" />
    <meta name="x5-fullscreen" content="true" />
    <meta name="x5-page-mode" content="app" />
    <meta name="HandheldFriendly" content="true" />
    
    <!-- App Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <meta property="og:title" content="VocalMaster Pro - Professional Vocal Training & Piano Studio" />
    <meta property="og:description" content="Professional vocal range trainer, pitch detector, and realistic concert grand piano studio with human vocal timbres library." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-[#030712] text-slate-100 select-none">
    <div id="root"></div>
    <script>
      // Register service-worker.js for offline access & cache-first static assets
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js', { scope: '/' }).catch((err) => {
            console.log('SW registration fallback:', err);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
